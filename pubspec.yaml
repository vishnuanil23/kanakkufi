name: kanakkufi
description: "A fintech expense tracking application built with Flutter and Clean Architecture."
version: 1.0.0+1

environment:
  sdk: ^3.7.0-323.0.dev

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  go_router: ^14.1.0
  supabase_flutter: ^2.5.6
  flutter_dotenv: ^5.1.0
  fl_chart: ^0.69.2
  google_fonts: ^6.3.2
  package_info_plus: ^8.3.0
  http: ^1.6.0
  flutter_slidable: ^3.1.2
  flutter_secure_storage: ^9.2.4
  dartz: ^0.10.1
  equatable: ^2.0.8


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  yaml: ^3.1.2
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_logo.png"
  min_sdk_android: 21


flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - .env


  
