name: kanakkufi
description: "A fintech expense tracking application built with Flutter and Clean Architecture."
version: 1.0.0+1

environment:
  sdk: ^3.7.0-323.0.dev

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  flutter_secure_storage: ^11.2.0
  share_plus: ^13.3.1
  permission_handler: 11.4.0
  equatable: ^2.1.0
  http: ^1.6.0
  supabase_flutter: ^2.18.2
  dartz: ^0.10.1
  flutter_slidable: ^4.0.3
  package_info_plus: ^10.2.2
  google_fonts: ^8.2.1
  fl_chart: ^1.2.0
  flutter_dotenv: ^6.0.1
  go_router: ^17.5.0
  workmanager: ^0.10.10
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  path_provider: 2.1.5
  another_telephony: ^0.4.1


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  yaml: ^3.1.2
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_logo.png"
  min_sdk_android: 21


flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - .env


  
